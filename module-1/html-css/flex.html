<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        padding: 20px;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center
    }

    .flex {
        display: flex;
        gap: 10px;
        background-color: beige;
        padding: 20px;
        justify-content: center;
        border-radius: 20px;
        flex-wrap: wrap;
        animation: shake alternate-reverse infinite 3s;
    }

    @keyframes shake {
        from {
            width: 250px;
        }

        to {
            width: 100px;
        }
    }

    .flex>div {
        width: 30px;
        height: 30px;
        background-color: blue;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        border-radius: 50%;
    }
</style>

<body>
    <div class="flex">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>

</html>
